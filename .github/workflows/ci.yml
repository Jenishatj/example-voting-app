name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-vote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./vote
        run: pip install -r requirements.txt
      - name: Lint Python
        working-directory: ./vote
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Pytest
        working-directory: ./vote
        run: pytest test_app.py

  test-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./result
        run: npm install
      - name: Run Jest
        working-directory: ./result
        run: npm test

  build-and-push:
    needs: [test-vote, test-result]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: [build-and-push]
    # This ensures it ONLY runs when merged into main, never on a feature branch PR
    if: github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the app directory
            cd /home/${{ secrets.VM_USERNAME }}/example-voting-app
            
            # FORCE sync the server using YOUR repository URL
            git fetch https://github.com/Jenishatj/example-voting-app.git main
            git reset --hard FETCH_HEAD
            
            # Export the Postgres password
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            
            # Enable BuildKit for older docker-compose versions
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Pull latest images and restart the stack
            docker-compose pull
            docker-compose up -d --no-build